name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check manifest.json version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but manifest.json version is $manifest_version - bump manifest.json before tagging."
            exit 1
          fi

      - name: Zip the extension directory
        run: |
          mkdir -p dist
          zip -r "dist/backpack-capture-${GITHUB_REF_NAME}.zip" \
            manifest.json icons src \
            -x "*.map"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
