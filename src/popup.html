<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Backpack Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Backpack Capture</h1>
      <p class="subtitle">Read-only Classroom capture. Nothing leaves your browser until you export.</p>
    </header>

    <section class="actions">
      <button id="captureNow" class="primary">Capture this tab</button>
      <button id="exportJson">Export JSON</button>
      <button id="clearAll" class="danger">Clear all</button>
    </section>

    <p id="status" class="status" hidden></p>

    <section class="list-wrap">
      <ul id="captureList"></ul>
      <p id="emptyState" class="empty" hidden>No captures yet. Open a Google Classroom page and it will capture automatically, or click "Capture this tab".</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
