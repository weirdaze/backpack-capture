<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c9c93"/>
      <stop offset="100%" stop-color="#0d5f5b"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- backpack silhouette -->
  <g>
    <!-- straps -->
    <path d="M 46 34 Q 46 20 58 20 L 58 46 L 46 46 Z" fill="#0d5f5b"/>
    <path d="M 82 34 Q 82 20 70 20 L 70 46 L 82 46 Z" fill="#0d5f5b"/>

    <!-- top flap -->
    <rect x="40" y="28" width="48" height="26" rx="12" fill="#f4fbfa"/>

    <!-- main body -->
    <rect x="32" y="44" width="64" height="62" rx="16" fill="#f4fbfa"/>

    <!-- front pocket -->
    <rect x="48" y="70" width="32" height="26" rx="9" fill="#1c9c93"/>
    <!-- zip pull -->
    <circle cx="64" cy="72" r="3.2" fill="#f4fbfa"/>
  </g>
</svg>
